version: 1
# How the exports in data/imports/ map onto Medjay's normalized facts.
funnel:
  qualified: [qualified]
attribution:
  source_aliases:
    meta: [facebook, instagram, fb, ig, meta]
    google: [google, adwords]
sources:
  - id: meta_ads
    kind: ad_platform
    platform: meta
    currency: SAR
    file: "meta-ads-*.csv"
    columns:
      date: Day
      campaign: Campaign name
      adset: Ad set name
      spend: Amount spent (SAR)
      impressions: Impressions
      clicks: Link clicks
      conversions: Results
  - id: google_ads
    kind: ad_platform
    platform: google
    currency: SAR
    file: "google-ads-*.csv"
    skip_rows: 2
    date_format: dmy
    columns:
      date: Day
      campaign: Campaign
      adset: Ad group
      spend: Cost
      impressions: Impr.
      clicks: Clicks
      conversions: Conversions
      conv_value: Conv. value
  - id: ga4
    kind: web_analytics
    file: "ga4-*.csv"
    columns:
      date: Date
      landing_page: Landing page
      source: Session source / medium
      campaign: Session campaign
      sessions: Sessions
      key_events: Key events
  - id: respond_io
    kind: crm
    file: "respond-io-*.json"
    currency: SAR
    records_path: contacts
    fields:
      lead_id: id
      created_at: created_at
      utm_source: utm.source
      campaign: utm.campaign
      adset: utm.content
      click_id: click_id
      phone: phone
      channel: channel
      first_response_seconds: first_response_seconds
      ghosted_after_price: ghosted_after_price
    stages: { path: stages, name: stage, at: at }
    deal: { path: deal, id: id, value: value, currency: currency, won_at: won_at }
