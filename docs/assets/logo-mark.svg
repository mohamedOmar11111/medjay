  <!-- Bottom Right Shen Binding Segments -->
  <path d="M 332 430 A 190 190 0 0 0 404 376" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="butt"/>

  <!-- Shen Ring Base Bar & Knot (Authentic Cartouche Anchor) -->
  <rect x="176" y="446" width="160" height="18" rx="9" fill="#FFFFFF"/>
  <rect x="242" y="422" width="28" height="46" rx="4" fill="#FFFFFF"/>

