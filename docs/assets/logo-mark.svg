  <path d="M 136 168 C 176 124 246 118 294 148 L 284 168 C 242 144 184 148 148 184 Z" fill="#FFFFFF"/>
  <path d="M 126 202 C 168 164 234 158 282 182 L 272 200 C 230 180 174 184 138 218 Z" fill="#FFFFFF"/>

